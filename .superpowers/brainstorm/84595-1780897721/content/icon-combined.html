<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analogue Icons — A+C Combined</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  background: #0f0f13;
  color: #e0e0e8;
  padding: 32px 28px 60px;
}
h1 { font-size: 20px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.sub { font-size: 13px; color: #666; margin-bottom: 32px; }

/* ── Icon sizing contexts ── */
.contexts { display: flex; flex-direction: column; gap: 32px; }

.ctx-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #444;
  margin-bottom: 14px; padding-bottom: 6px; border-bottom: 1px solid #1c1c24;
}
.ctx-row { display: flex; align-items: flex-end; gap: 14px; }
.icon-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.icon-name { font-size: 10px; color: #555; text-align: center; }

/* ── BASE SQUIRCLE ── */
.sq {
  border-radius: 22.37%;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ── NOTES — lined paper on cork ── */
.notes-icon {
  background:
    linear-gradient(160deg, #d4a96a 0%, #b8843a 40%, #9a6820 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.55),
    inset 0 -2px 3px rgba(0,0,0,0.3),
    0 6px 16px rgba(0,0,0,0.45);
}
/* cork grain via repeating dots */
.notes-icon::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle, rgba(180,130,60,0.35) 1px, transparent 1px);
  background-size: 4px 4px;
  background-position: 0 0;
}
.notes-paper {
  position: relative; z-index: 2;
  background: rgba(255,253,240,0.94);
  border-radius: 3px;
  display: flex; flex-direction: column; justify-content: center;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);
}
.notes-paper::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    180deg,
    transparent, transparent 7px,
    rgba(150,170,220,0.35) 7px, rgba(150,170,220,0.35) 8px
  );
  background-position: 0 4px;
}
.notes-pencil {
  position: absolute; z-index: 3;
  bottom: 0; right: 0;
  font-size: 0;
  width: 4px;
  border-radius: 2px 2px 0 0;
  background: linear-gradient(180deg, #f5c842, #d4a020);
}

/* ── TERMINAL — brushed dark aluminum + green code ── */
.term-icon {
  background:
    repeating-linear-gradient(
      92deg,
      #22222a 0px, #2a2a34 1px, #22222a 2px, #262630 3px
    );
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.14),
    inset 0 -2px 4px rgba(0,0,0,0.55),
    0 6px 16px rgba(0,0,0,0.55);
}
.term-icon::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(160deg, rgba(255,255,255,0.07) 0%, transparent 55%);
}
.term-code {
  position: relative; z-index: 2;
  font-family: 'SF Mono', 'Menlo', monospace;
  font-weight: 700;
  color: #00ff88;
  text-shadow: 0 0 10px rgba(0,255,136,0.7);
  line-height: 1.25;
  text-align: left;
}

/* ── PROJECTS — dark woven film ── */
.proj-icon {
  background: radial-gradient(ellipse at 30% 25%, #3a2010 0%, #1e1008 60%, #120800 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,190,80,0.28),
    inset 0 -2px 4px rgba(0,0,0,0.6),
    0 6px 16px rgba(0,0,0,0.55);
}
.proj-icon::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 5px, rgba(255,180,60,0.04) 5px, rgba(255,180,60,0.04) 6px),
    repeating-linear-gradient(90deg, transparent, transparent 5px, rgba(255,180,60,0.04) 5px, rgba(255,180,60,0.04) 6px);
}
.proj-clapper {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.proj-board {
  background: rgba(255,255,255,0.88);
  border-radius: 2px;
}
.proj-stripe {
  width: 100%; height: 100%;
  background: repeating-linear-gradient(90deg, #1a1a1a 0px, #1a1a1a 4px, white 4px, white 8px);
  border-radius: 2px 2px 0 0;
}

/* ── ABOUT — polished glass sphere + monogram ── */
.about-icon {
  background: radial-gradient(ellipse at 32% 28%, #7ac0ff 0%, #3474ea 45%, #1040c8 100%);
  box-shadow:
    inset 0 2.5px 0 rgba(255,255,255,0.65),
    inset 0 -3px 5px rgba(0,0,0,0.35),
    0 6px 20px rgba(30,80,220,0.35),
    0 2px 6px rgba(0,0,0,0.3);
}
/* specular highlight */
.about-icon::before {
  content: '';
  position: absolute; top: 4px; left: 5px;
  width: 42%; height: 28%;
  background: rgba(255,255,255,0.52);
  border-radius: 50%;
  filter: blur(2px);
  z-index: 1;
}
.about-mono {
  position: relative; z-index: 2;
  font-weight: 800;
  color: rgba(255,255,255,0.92);
  text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  letter-spacing: -0.02em;
}

/* ── CONTACT — green felt + geometric envelope ── */
.contact-icon {
  background: linear-gradient(160deg, #3dc864 0%, #1e8a3c 50%, #0f5a22 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.45),
    inset 0 -2px 3px rgba(0,0,0,0.3),
    0 6px 16px rgba(0,0,0,0.45);
}
.contact-icon::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    45deg, transparent, transparent 3px, rgba(255,255,255,0.03) 3px, rgba(255,255,255,0.03) 4px
  );
}
.env-wrap {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.env-body {
  background: rgba(255,255,255,0.92);
  border-radius: 2px;
  position: relative;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  overflow: hidden;
}
.env-flap {
  position: absolute; top: 0; left: 0; right: 0;
  background: rgba(200,240,210,0.7);
  clip-path: polygon(0 0, 50% 55%, 100% 0);
}

/* ── REEL — vinyl / film reel ── */
.reel-icon {
  background: linear-gradient(160deg, #d060c0 0%, #8030c0 50%, #4010a0 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.45),
    inset 0 -2px 3px rgba(0,0,0,0.3),
    0 6px 16px rgba(0,0,0,0.45);
}
.reel-icon::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-conic-gradient(
    rgba(255,255,255,0.04) 0deg, rgba(0,0,0,0.04) 30deg,
    rgba(255,255,255,0.04) 60deg, rgba(0,0,0,0.04) 90deg,
    rgba(255,255,255,0.04) 120deg, rgba(0,0,0,0.04) 150deg
  );
}
.reel-symbol {
  position: relative; z-index: 2;
  font-weight: 900;
  color: rgba(255,255,255,0.92);
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
}

/* ── Dark desktop wallpaper preview ── */
.desktop-preview {
  margin-top: 16px;
  background:
    radial-gradient(60% 55% at 18% 12%, rgba(124, 77, 255, 0.4), transparent 60%),
    radial-gradient(55% 55% at 86% 88%, rgba(255, 64, 180, 0.3), transparent 62%),
    radial-gradient(120% 120% at 25% 8%, #1d1452 0%, #100c30 46%, #08060f 100%);
  border-radius: 14px;
  padding: 20px;
  border: 1px solid rgba(255,255,255,0.08);
}
.desktop-label { font-size: 10px; color: #555; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px; }
</style>
</head>
